# Runs the Next.js dev server itself inside a container, joined to
# Keycloak's docker network (see /keycloak/docker-compose.yml — start that
# one first). This exists solely to work around a local machine issue:
# Proxifier (unrelated software running on this dev machine) intercepts
# node.exe's outbound TCP connections and breaks them, even to localhost —
# so next-auth's server-side OIDC calls (discovery/token/jwks) fail when
# the frontend runs natively on Windows. A container's network namespace is
# invisible to Proxifier, so this sidesteps it entirely. See AGENTS.md's
# frontend "Known local issue" for the full diagnosis.
#
# The backend keeps running natively (its own Go HTTP client is
# unaffected by this — proven by internal/authz.NewVerifier working fine
# from a native process) — only the frontend needs this. Browser-facing
# URLs (NEXT_PUBLIC_API_BASE, the Keycloak authorization redirect) are
# unchanged; only this server process's own outbound calls move to the
# container network — see auth.ts's top comment.
#
# Usage:
#   cd keycloak && docker compose up -d        # once, if not already up
#   cd ../frontend && docker compose -f docker-compose.dev.yml up
# Then open http://localhost:3100 same as always.
services:
  frontend:
    image: node:22-alpine
    container_name: vinaire-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3100:3100"
    environment:
      # Container-network path to Keycloak for this server process's own
      # calls — everything else comes from .env.local (still loaded by
      # Next.js from the bind-mounted source), including
      # AUTH_KEYCLOAK_AUTHORIZATION_URL, which stays host-published
      # (localhost:8180) since only the browser ever uses it.
      AUTH_KEYCLOAK_ISSUER: http://vinaire-keycloak:8080/realms/vinaire-dev
      # Windows bind-mount file events don't reliably reach webpack's
      # watcher inside a Linux container — fall back to polling.
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      # Anonymous volumes: keep the container's own Linux-native
      # node_modules/.next separate from the host's Windows ones instead of
      # letting the bind mount above shadow them.
      - /app/node_modules
      - /app/.next
    networks:
      - default

networks:
  default:
    name: keycloak_default
    external: true
