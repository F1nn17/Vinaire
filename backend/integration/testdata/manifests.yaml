# Fixture resources for Phase 23's integration test suite. Applied to a
# throwaway k3d cluster in CI (see .github/workflows/ci.yml) before the
# backend and integration tests run — every test in ../integration_test.go
# asserts against these exact names, so keep the two in sync.
apiVersion: v1
kind: Namespace
metadata:
  name: vinaire-ci-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-deployment
  namespace: vinaire-ci-test
  labels:
    app: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-statefulset
  namespace: vinaire-ci-test
  labels:
    app: demo-sts
spec:
  serviceName: demo-statefulset
  replicas: 1
  selector:
    matchLabels:
      app: demo-sts
  template:
    metadata:
      labels:
        app: demo-sts
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: demo-daemonset
  namespace: vinaire-ci-test
  labels:
    app: demo-ds
spec:
  selector:
    matchLabels:
      app: demo-ds
  template:
    metadata:
      labels:
        app: demo-ds
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-job
  namespace: vinaire-ci-test
spec:
  template:
    spec:
      containers:
        - name: busybox
          image: busybox
          command: ["echo", "done"]
      restartPolicy: Never
  backoffLimit: 1
---
apiVersion: v1
kind: Service
metadata:
  name: demo-service
  namespace: vinaire-ci-test
spec:
  selector:
    app: demo
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-configmap
  namespace: vinaire-ci-test
data:
  greeting: hello-from-ci
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-secret
  namespace: vinaire-ci-test
type: Opaque
stringData:
  token: super-secret-value
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-pvc
  namespace: vinaire-ci-test
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-ingress
  namespace: vinaire-ci-test
spec:
  rules:
    - host: demo.ci-test.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-service
                port:
                  number: 80
