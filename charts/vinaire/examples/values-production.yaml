# A real install: image from a registry, HTTPS, single sign-on.
#
#   helm upgrade --install vinaire ./charts/vinaire \
#     --namespace vinaire --create-namespace \
#     -f values-production.yaml
#
# Replace every <placeholder>. Keep the real OIDC client secret out of this file:
# create the Secret yourself and name it in oidc.existingSecret.
#   kubectl create secret generic vinaire-oidc -n vinaire \
#     --from-literal=clientSecret='<client secret>'

image:
  repository: <registry>/<owner>/vinaire
  # Pin a version; never :latest on a real install.
  tag: "<version>"
  pullPolicy: IfNotPresent

# imagePullSecrets:
#   - name: <registry pull secret>

clusterName: <cluster-name>

authMode: oidc
oidc:
  issuerURL: https://<keycloak-host>/realms/<realm>
  clientID: vinaire
  existingSecret: vinaire-oidc
  redirectURL: https://vinaire.<your-domain>/api/v1/auth/oidc/callback
frontendURL: https://vinaire.<your-domain>

# The default (true) is correct for HTTPS — leave it.
cookie:
  secure: true
  sameSite: strict

# The ingress controller sets X-Forwarded-For, so the login throttle sees the real client.
trustForwardedFor: true

ingress:
  enabled: true
  className: <nginx|traefik|...>
  annotations: {}
  hosts:
    - host: vinaire.<your-domain>
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: vinaire-tls
      hosts:
        - vinaire.<your-domain>

# Only the ingress controller's namespace may reach Vinaire (needs a CNI that
# enforces NetworkPolicy).
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: <ingress-controller-namespace>
