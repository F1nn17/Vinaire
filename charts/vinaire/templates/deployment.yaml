apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vinaire.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vinaire.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.audit.persistence.enabled }}
  {{- if gt (int .Values.replicaCount) 1 }}
  {{- fail "audit.persistence.enabled keeps the audit log on one ReadWriteOnce volume with a single writer and needs replicaCount: 1 — with several replicas ship the container's stdout to your log system instead" }}
  {{- end }}
  # the volume can be mounted by one pod: the old pod must be gone before the new one starts
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "vinaire.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vinaire.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vinaire.serviceAccountName" . }}
      # Roadmap Phase 36: the pod needs no privileges at all.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vinaire
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CLUSTER_NAME
              value: {{ default .Release.Name .Values.clusterName | quote }}
            - name: AUTH_MODE
              value: {{ .Values.authMode | quote }}
            {{- if eq .Values.authMode "oidc" }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerURL | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientID | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret | default (printf "%s-oidc" (include "vinaire.fullname" .)) }}
                  key: {{ .Values.oidc.existingSecretKey | default "clientSecret" }}
            - name: OIDC_REDIRECT_URL
              value: {{ .Values.oidc.redirectURL | quote }}
            {{- end }}
            {{- with .Values.frontendURL }}
            - name: FRONTEND_URL
              value: {{ . | quote }}
            {{- end }}
            - name: AUDIT_LOG_PATH
              value: /audit/audit.log
            {{- $store := include "vinaire.sessionStore" . }}
            {{- if and (eq $store "memory") (gt (int .Values.replicaCount) 1) }}
            {{- fail "replicaCount > 1 needs sessions.store=secret (or auto): sessions kept in a pod's memory can't be shared between replicas" }}
            {{- end }}
            {{- if and (eq $store "secret") (not .Values.rbac.clusterManagement.create) }}
            {{- fail "sessions.store=secret keeps the sessions in a Secret and needs rbac.clusterManagement.create=true" }}
            {{- end }}
            - name: SESSION_STORE
              value: {{ $store | quote }}
            {{- if gt (int .Values.replicaCount) 1 }}
            - name: LEADER_ELECTION
              value: "true"
            {{- end }}
            {{- $kp := .Values.keyProvider | default dict }}
            {{- if eq ($kp.type | default "local") "vault" }}
            {{- $v := $kp.vault | default dict }}
            {{- if not $v.addr }}
            {{- fail "keyProvider.type=vault needs keyProvider.vault.addr" }}
            {{- end }}
            - name: KEY_PROVIDER
              value: "vault"
            - name: VAULT_ADDR
              value: {{ $v.addr | quote }}
            - name: VAULT_TRANSIT_MOUNT
              value: {{ $v.transitMount | default "transit" | quote }}
            - name: VAULT_TRANSIT_KEY
              value: {{ $v.key | default "vinaire" | quote }}
            {{- with $v.namespace }}
            - name: VAULT_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            {{- if $v.allowInsecure }}
            - name: VAULT_ALLOW_INSECURE
              value: "true"
            {{- end }}
            {{- if eq ($v.auth | default "kubernetes") "token" }}
            {{- if not $v.tokenSecret }}
            {{- fail "keyProvider.vault.auth=token needs keyProvider.vault.tokenSecret (an existing Secret holding the token)" }}
            {{- end }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $v.tokenSecret | quote }}
                  key: {{ $v.tokenSecretKey | default "token" | quote }}
            {{- else }}
            - name: VAULT_K8S_ROLE
              value: {{ $v.kubernetesRole | default "vinaire" | quote }}
            - name: VAULT_K8S_MOUNT
              value: {{ $v.kubernetesMount | default "kubernetes" | quote }}
            {{- end }}
            {{- if $kp.rewrapOnStart }}
            - name: KEY_REWRAP_ON_START
              value: "true"
            {{- end }}
            {{- end }}
            - name: SESSION_MAX_TTL
              value: {{ .Values.sessionMaxTTL | quote }}
            {{- if .Values.trustForwardedFor }}
            - name: TRUST_FORWARDED_FOR
              value: "true"
            {{- end }}
            - name: COOKIE_SECURE
              value: {{ .Values.cookie.secure | quote }}
            - name: COOKIE_SAMESITE
              value: {{ .Values.cookie.sameSite | quote }}
            {{- with .Values.observability.prometheusURL }}
            - name: PROMETHEUS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.observability.lokiURL }}
            - name: LOKI_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.observability.alertmanagerURL }}
            - name: ALERTMANAGER_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.backup.targets }}
            - name: BACKUP_TARGETS
              value: /etc/vinaire/backup/backup.json
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # the only places Vinaire writes: the durable audit log, and scratch space
            - {name: audit, mountPath: /audit}
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.backup.targets }}
            - {name: backup, mountPath: /etc/vinaire/backup, readOnly: true}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: audit
          {{- if .Values.audit.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.audit.persistence.existingClaim | default (printf "%s-audit" (include "vinaire.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.backup.targets }}
        - name: backup
          configMap:
            name: {{ include "vinaire.fullname" . }}-backup
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
