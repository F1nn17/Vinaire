apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vinaire.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vinaire.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vinaire.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vinaire.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vinaire.serviceAccountName" . }}
      # Roadmap Phase 36: the pod needs no privileges at all.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vinaire
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CLUSTER_NAME
              value: {{ default .Release.Name .Values.clusterName | quote }}
            - name: AUTH_MODE
              value: {{ .Values.authMode | quote }}
            {{- if eq .Values.authMode "oidc" }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerURL | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientID | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret | default (printf "%s-oidc" (include "vinaire.fullname" .)) }}
                  key: {{ .Values.oidc.existingSecretKey | default "clientSecret" }}
            - name: OIDC_REDIRECT_URL
              value: {{ .Values.oidc.redirectURL | quote }}
            {{- end }}
            {{- with .Values.frontendURL }}
            - name: FRONTEND_URL
              value: {{ . | quote }}
            {{- end }}
            - name: AUDIT_LOG_PATH
              value: /audit/audit.log
            - name: SESSION_MAX_TTL
              value: {{ .Values.sessionMaxTTL | quote }}
            {{- if .Values.trustForwardedFor }}
            - name: TRUST_FORWARDED_FOR
              value: "true"
            {{- end }}
            - name: COOKIE_SECURE
              value: {{ .Values.cookie.secure | quote }}
            - name: COOKIE_SAMESITE
              value: {{ .Values.cookie.sameSite | quote }}
            {{- with .Values.observability.prometheusURL }}
            - name: PROMETHEUS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.observability.lokiURL }}
            - name: LOKI_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.observability.alertmanagerURL }}
            - name: ALERTMANAGER_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # the only places Vinaire writes: the durable audit log, and scratch space
            - {name: audit, mountPath: /audit}
            - {name: tmp, mountPath: /tmp}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: audit
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
