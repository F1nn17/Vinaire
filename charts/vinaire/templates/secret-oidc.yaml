{{- if and (eq .Values.authMode "oidc") .Values.oidc.clientSecret (not .Values.oidc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vinaire.fullname" . }}-oidc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vinaire.labels" . | nindent 4 }}
type: Opaque
stringData:
  clientSecret: {{ .Values.oidc.clientSecret | quote }}
{{- end }}
