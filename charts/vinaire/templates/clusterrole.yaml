{{- if .Values.rbac.create }}
{{- /*
Vinaire's OWN ServiceAccount. In token and OIDC mode every request a user makes
runs as that user's identity, so this account only needs what the live-update
informers and cluster-type detection read with Vinaire's own credentials —
nothing that writes, and no Secrets. The broad browse-and-act set is a separate
role (<release>-viewer) for people to be bound to. Only AUTH_MODE=disabled (a
disposable local cluster, where every request uses this account) or an explicit
rbac.broad=true gives this account the broad set.
*/ -}}
{{- $broad := or (eq .Values.authMode "disabled") .Values.rbac.broad }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vinaire.fullname" . }}
  labels:
    {{- include "vinaire.labels" . | nindent 4 }}
rules:
  {{- if $broad }}
  {{- include "vinaire.broadRules" . | nindent 2 }}
  {{- else }}
  # The live-update informers (internal/stream) watch these cluster-wide.
  - apiGroups: ["", "apps", "batch"]
    resources: [pods, deployments, statefulsets, daemonsets, jobs, nodes]
    verbs: ["get", "list", "watch"]
  # Cluster-type detection and "is this the same cluster" (internal/clusters):
  # one namespace and one ConfigMap, by name.
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: ["get"]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [kubeadm-config]
    verbs: ["get"]
  {{- end }}
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
{{- if .Values.rbac.viewer.create }}
# What a person needs to use Vinaire fully: bind this to the ServiceAccount or
# user that logs in (see NOTES). Not bound to anyone by default.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vinaire.fullname" . }}-viewer
  labels:
    {{- include "vinaire.labels" . | nindent 4 }}
rules:
  {{- include "vinaire.broadRules" . | nindent 2 }}
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
{{- end }}
{{- if .Values.rbac.installer.create }}
# What installing from the Marketplace (Roadmap Phase 28) and applying YAML
# (Phase 25) need on top of -viewer: create/update/delete for the namespaced kinds
# charts most often contain, plus Helm's release Secrets. It is the caller's own
# RBAC that Helm runs under, so this is what the cluster lets that person do — it
# is NOT bound to anyone by default. A chart that creates something outside this
# list (a ClusterRole, a CRD, an unusual group) fails the install's access check
# with the exact kinds missing; add them with rbac.installer.extraRules, or bind
# a broader role for a throwaway dev cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vinaire.fullname" . }}-installer
  labels:
    {{- include "vinaire.labels" . | nindent 4 }}
  annotations:
    description: "Create/update/delete the namespaced kinds Helm charts usually contain, plus release Secrets. Bind together with the -viewer role."
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, serviceaccounts, persistentvolumeclaims, pods, resourcequotas, limitranges]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses, networkpolicies]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy", "autoscaling"]
    resources: [poddisruptionbudgets, horizontalpodautoscalers]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Charts that ship their own Role/RoleBinding. Kubernetes' escalation check
  # still stops anyone granting more than they themselves hold.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [roles, rolebindings]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Installing into a new namespace ("Create namespace" in the install dialog).
  - apiGroups: [""]
    resources: [namespaces]
    verbs: ["create"]
  {{- with .Values.rbac.installer.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
{{- end }}
{{- if .Values.rbac.nodeAdmin.create }}
# Node lifecycle (Roadmap Phase 40): cordon / uncordon, drain, labels, taints and
# removing a Node object. Kept apart from -viewer so that who may take a node out of
# service is a decision, not a side effect of being able to browse. Bind it IN
# ADDITION to -viewer to whoever operates the nodes. Not bound to anyone by default.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vinaire.fullname" . }}-node-admin
  labels:
    {{- include "vinaire.labels" . | nindent 4 }}
  annotations:
    description: "Cordon, drain, label, taint and delete nodes. Bind together with the -viewer role."
rules:
  # cordon/uncordon, labels and taints are patches of the Node; "delete node" is a delete
  - apiGroups: [""]
    resources: [nodes]
    verbs: ["get", "list", "watch", "patch", "delete"]
  # drain evicts through the Eviction API (which honours PodDisruptionBudgets)
  - apiGroups: [""]
    resources: [pods]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: ["create"]
---
{{- end }}
{{- if .Values.rbac.rbacAdmin.create }}
# Managing who may do what (Roadmap Phase 44): create and delete RoleBindings and
# ClusterRoleBindings, and ask "may X do Y?" (SubjectAccessReview). Vinaire never
# creates or edits Roles/ClusterRoles — it only hands out ones that exist. Even with
# this role Kubernetes' escalation check applies: you can bind a role only if you
# hold everything it grants OR have `bind` on it; this role grants `bind` for exactly
# this chart's own roles, so an administrator can hand those out without being
# cluster-admin. Bind it IN ADDITION to -viewer. Not bound to anyone by default.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vinaire.fullname" . }}-rbac-admin
  labels:
    {{- include "vinaire.labels" . | nindent 4 }}
  annotations:
    description: "Create/delete RoleBindings and ClusterRoleBindings and check what a subject may do. May bind this chart's own roles."
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [rolebindings, clusterrolebindings]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [roles, clusterroles]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [clusterroles]
    verbs: ["bind"]
    resourceNames:
      - {{ include "vinaire.fullname" . }}-viewer
      - {{ include "vinaire.fullname" . }}-installer
      - {{ include "vinaire.fullname" . }}-node-admin
      - {{ include "vinaire.fullname" . }}-rbac-admin
      - {{ include "vinaire.fullname" . }}-admin
  - apiGroups: ["authorization.k8s.io"]
    resources: [subjectaccessreviews]
    verbs: ["create"]
---
{{- end }}
{{- if .Values.rbac.adminRole.create }}
# Permission to change Vinaire ITSELF (Roadmap Phase 36): add/remove clusters in
# its registry, change a cluster's type, GitOps mode and sources. These resources
# don't exist in the cluster — they are only names for the permission, which
# Vinaire checks with a SelfSubjectAccessReview as the caller. Bind this to
# whoever administers Vinaire; ordinary users who can browse can't change it.
#
# NOT "cluster admin": this role grants NOTHING inside Kubernetes — not reading
# a Pod, not installing a chart. Whoever logs in needs it IN ADDITION to
# <fullname>-viewer (browse) and, to install from the Marketplace,
# <fullname>-installer.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vinaire.fullname" . }}-admin
  labels:
    {{- include "vinaire.labels" . | nindent 4 }}
  annotations:
    description: "Permission to change Vinaire's own settings (clusters, GitOps, sign-in through Keycloak). Grants no access to anything in Kubernetes — bind it together with the -viewer role."
rules:
  - apiGroups: ["vinaire.io"]
    resources: ["clusters", "gitops"]
    verbs: ["create", "update", "delete"]
  # Reading the audit log (who did what, when) — the virtual resource audit.vinaire.io.
  - apiGroups: ["vinaire.io"]
    resources: ["audit"]
    verbs: ["get"]
  # Setting up sign-in through Keycloak (Phase 47) — the virtual resource auth.vinaire.io.
  - apiGroups: ["vinaire.io"]
    resources: ["auth"]
    verbs: ["get", "create", "update", "delete"]
{{- with .Values.rbac.adminRole.subjects }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vinaire.fullname" $ }}-admin
  labels:
    {{- include "vinaire.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vinaire.fullname" $ }}-admin
subjects:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
