{{- if .Values.rbac.create }}
# Matches AGENTS.md's "Example: a minimal ClusterRole for Vinaire" —
# read-only across everything Vinaire's UI browses, plus the exact three
# Deployment write actions the project's core rule names as the
# deliberate, audited exception. Not cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vinaire.fullname" . }}
  labels:
    {{- include "vinaire.labels" . | nindent 4 }}
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
    resources:
      - pods
      - deployments
      - statefulsets
      - daemonsets
      - jobs
      - configmaps
      - secrets
      - services
      - ingresses
      - events
      - replicasets
      - serviceaccounts
      - persistentvolumeclaims
      - persistentvolumes
      - nodes
    verbs: ["get", "list", "watch"]
  # metrics-server's aggregated API — Pod/Node CPU/Memory gauges and the
  # Dashboard's cluster-wide usage all degrade to an honest "—" without
  # this rather than failing loudly, so it's easy to forget.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # pods/log and pods/exec are separate RBAC subresources — granting
  # "pods" above does NOT imply either of these.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  # The exact three write actions AGENTS.md's core rule allows — nothing
  # else, on any resource kind, should ever be added here.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch", "delete"]
{{- end }}
