{{- $_ := include "vinaire.defaults" . -}}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vinaire.fullname" . }}
  labels:
    {{- include "vinaire.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vinaire.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vinaire.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
