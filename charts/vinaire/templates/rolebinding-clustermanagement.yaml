{{- $_ := include "vinaire.defaults" . -}}
{{- if .Values.rbac.clusterManagement.create }}
# Backs "add a cluster via the web UI" (Settings page, Roadmap Phase 24) —
# a deliberately separate, narrower Role from the ClusterRole above: it
# only ever touches one specific Secret ("vinaire-clusters", the fixed
# name internal/clusters.Store writes to) in this release's own namespace.
# See AGENTS.md's core rule for why this is a distinct kind of write from
# everything else Vinaire does.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vinaire.fullname" . }}-cluster-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vinaire.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["vinaire-clusters", "vinaire-clusters-key"]
    verbs: ["get", "update"]
  # Roadmap Phase 48: sessions shared between replicas live in this one Secret, one key
  # per session, changed with a patch of that key alone.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["vinaire-sessions"]
    verbs: ["get", "patch"]
  # Roadmap Phase 48: the leader-election Lease (only used with more than one replica).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["vinaire-leader"]
    verbs: ["get", "update"]
  # Roadmap Phase 34: the registry is sealed (AES-GCM) and its key lives in the
  # *separate* Secret vinaire-clusters-key, generated on first run (create is
  # allowed above, get/update only for these two names). Skip this Secret by
  # setting CLUSTER_STORE_KEY instead.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vinaire.fullname" . }}-cluster-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vinaire.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vinaire.fullname" . }}-cluster-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "vinaire.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
