{{- $_ := include "vinaire.defaults" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vinaire.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vinaire.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if gt (int .Values.replicaCount) 1 }}
  # A running install or provisioning job lives on the replica that started it, so a
  # client keeps talking to the same one (Roadmap Phase 48).
  sessionAffinity: ClientIP
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vinaire.selectorLabels" . | nindent 4 }}
