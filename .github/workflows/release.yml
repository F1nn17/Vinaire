name: Release

# Roadmap Phase 50: what leaves this repository is signed and comes with proof of how it was
# built. On a version tag the image is built, pushed to GitHub's container registry, signed
# with cosign (keyless: the signature is tied to this workflow's identity, no key to leak),
# and published with a CycloneDX SBOM and a build-provenance attestation. The Helm chart is
# pushed next to it as an OCI artifact (oci://ghcr.io/<owner>/charts/vinaire), signed the same
# way, and a GitHub Release is created with the chart and the SBOM attached.
#
# The tag must be v<chart version> (v1.0.0 for chart 1.0.0); the image is tagged with the bare
# version (1.0.0), which is what the chart's appVersion points at. To check a pulled image:
#
#   cosign verify ghcr.io/<owner>/vinaire:<version> \
#     --certificate-identity-regexp 'https://github.com/<owner>/<repo>/\.github/workflows/release\.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# How a release is made (Roadmap Phase 64; docs/releasing.md): bump the version in a pull request
# (scripts/release-prepare.sh), merge it, then run this workflow from main with that version —
# the "Run workflow" button, or `gh workflow run release.yml -f version=1.0.1`. It builds, signs and
# publishes everything below AND creates the tag v<version> and the GitHub Release itself, in this
# one workflow. (A tag created by the default GITHUB_TOKEN would not start another workflow, which
# is why tagging is part of this one rather than a separate step.) Pushing a v* tag by hand still
# works and does the same.
#
# Third-party actions are pinned by commit, as in security.yml; Dependabot moves them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1 (must equal the chart version on main)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    name: Build, push, sign, attest, release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push to ghcr.io
      id-token: write # keyless signing and the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4

      # ghcr.io names are lower case ("F1nn17/Vinaire" is not a valid image name), and the tag
      # has to agree with the chart so a release can't ship a chart pointing at another image.
      - name: Names and version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          version=$(grep '^version:' charts/vinaire/Chart.yaml | head -1 | tr -d ' "\r' | cut -d: -f2)
          app=$(grep '^appVersion:' charts/vinaire/Chart.yaml | head -1 | tr -d ' "\r' | cut -d: -f2)
          if [ "$version" != "$app" ]; then echo "chart version $version and appVersion $app must match"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match chart version v$version"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "a release is made from main, not from $GITHUB_REF"; exit 1
            fi
            if ! echo "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "version must look like 1.2.3 (or 1.2.3-rc.1)"; exit 1
            fi
            if [ "$INPUT_VERSION" != "$version" ]; then
              echo "asked for $INPUT_VERSION but charts/vinaire/Chart.yaml says $version — bump it in a pull request first (scripts/release-prepare.sh)"; exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
              echo "tag v$version already exists; a released version is never replaced"; exit 1
            fi
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$version]' section"; exit 1
          fi
          {
            echo "IMAGE=ghcr.io/${owner}/${repo,,}"
            echo "CHART_REPO=oci://ghcr.io/${owner}/charts"
            echo "VERSION=$version"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          # BuildKit's own SBOM and provenance, stored next to the image in the registry
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image by digest
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"

      - name: SBOM (CycloneDX) of the image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: vinaire-sbom.cdx.json
          upload-artifact: true

      - name: Attach the SBOM as a signed attestation
        run: cosign attest --yes --type cyclonedx --predicate vinaire-sbom.cdx.json "$IMAGE@${{ steps.build.outputs.digest }}"

      - name: GitHub build-provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Package and push the Helm chart
        id: chart
        run: |
          helm package charts/vinaire --destination .
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "vinaire-${VERSION}.tgz" "$CHART_REPO" 2>&1 | tee push.log
          echo "digest=$(sed -n 's/^Digest: //p' push.log)" >> "$GITHUB_OUTPUT"
      - name: Sign the chart by digest
        run: cosign sign --yes "${CHART_REPO#oci://}/vinaire@${{ steps.chart.outputs.digest }}"

      # The notes are the CHANGELOG's own section for this version. On a manual run the tag does not
      # exist yet: `gh release create` makes it, on exactly the commit that was built.
      - name: GitHub Release (and the tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v h="## [$VERSION]" '
            index($0, h) == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }' CHANGELOG.md > release-notes.md
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Vinaire $VERSION" --notes-file release-notes.md $flags \
              "vinaire-${VERSION}.tgz" vinaire-sbom.cdx.json
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Vinaire $VERSION" --notes-file release-notes.md $flags \
              "vinaire-${VERSION}.tgz" vinaire-sbom.cdx.json
          fi
