name: Security

# Roadmap Phase 36. These are checkable claims, not a guarantee of "no
# vulnerabilities": scanners don't find logic flaws (an RBAC bypass, a wrong
# permission check) — those are covered by the tests in `go test ./...` and by a
# manual review before Vinaire is exposed outside a trusted network.
#
# Runs on every pull request and push to main, and weekly: a vulnerability is
# published against a dependency you already ship, not only when you change it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go — govulncheck, gosec, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      # Fails when a dependency this code actually calls has a known vulnerability.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      # Medium and above only; every accepted finding carries a `#nosec <rule> -- <why>`
      # next to the code, so a new one has to be argued for in the diff.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -severity medium -confidence medium -exclude-dir=integration ./...
      # Includes the security tests: namespace-scoped stream, permission gate, login
      # throttle, CSP, canary-in-logs, codebase rules (no InsecureIgnoreHostKey...).
      - name: tests
        run: go test -count=1 ./...

  # Roadmap Phase 50: the parsers that take text from outside (kubeconfig, YAML, join
  # commands, node labels, install options...) are fuzzed against the properties they
  # promise. The same functions also run their seed inputs as ordinary tests on every build.
  fuzz:
    name: Fuzz — parsers and validators
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Fuzz every target for 30 seconds
        run: |
          set -e
          for pkg in $(grep -rl --include='*_test.go' '^func Fuzz' . | xargs -n1 dirname | sort -u); do
            for f in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz'); do
              echo "== $pkg $f"
              go test "$pkg" -run '^$' -fuzz "^$f\$" -fuzztime 30s
            done
          done

  # A software bill of materials for what the repository contains (Go modules and npm
  # packages), as CycloneDX. The release workflow does the same for the published image.
  sbom:
    name: SBOM — CycloneDX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: vinaire-source.cdx.json
          artifact-name: sbom-source

  frontend:
    name: Frontend — npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      # Production dependencies only; high and critical fail the build. (Two low
      # advisories on monaco-editor's bundled DOMPurify are known and accepted: the
      # editors never render untrusted markdown — see docs/security.md.)
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
      - name: lint (includes the no-dangerouslySetInnerHTML / no-web-storage rules)
        run: npm run lint

  secrets:
    name: Secrets — gitleaks over the full history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every commit, not just the tip
      # The release binary, checked against the project's published checksums —
      # `go install ...@latest` depended on sum.golang.org answering, which it
      # sometimes doesn't, and an unpinned `latest` isn't what a security gate should run.
      - name: gitleaks
        run: |
          v=8.30.1
          base=https://github.com/gitleaks/gitleaks/releases/download/v$v
          curl -fsSL --retry 5 --retry-all-errors -o gitleaks.tgz "$base/gitleaks_${v}_linux_x64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o checksums.txt "$base/gitleaks_${v}_checksums.txt"
          grep " gitleaks_${v}_linux_x64.tar.gz\$" checksums.txt | sed 's/ .*/  gitleaks.tgz/' | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --no-banner

  image:
    name: Image — trivy, then a dynamic check against a running instance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t vinaire:ci .

      # Fixable HIGH/CRITICAL vulnerabilities in the OS layer or in Go/npm
      # libraries baked into the image fail the build; ones with no fix yet don't.
      - name: trivy
        # Pinned by commit (v0.36.0): a tag can be moved, a commit can't. Dependabot bumps it.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vinaire:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Install k3d and Helm
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Install the chart on a disposable cluster
        run: |
          # the cluster's own load balancer publishes port 80 as localhost:8080 — a stable
          # path for the browser checks and the ZAP container (a `kubectl port-forward`
          # kept dropping, leaving ZAP with "connection refused")
          k3d cluster create vinaire-sec --agents 0 -p "8080:80@loadbalancer" --wait --timeout 120s
          k3d image import vinaire:ci -c vinaire-sec
          # the chart's own defaults: non-root, read-only root filesystem, no capabilities
          helm install vinaire charts/vinaire -n vinaire --create-namespace \
            --set image.repository=vinaire --set image.tag=ci --set image.pullPolicy=Never \
            --set cookie.secure=false \
            --set ingress.enabled=true --set ingress.className=traefik \
            --set 'ingress.hosts[0].host=localhost' --wait --timeout 180s
          kubectl -n vinaire rollout status deployment/vinaire --timeout=120s
      - name: Prove the pod really runs hardened
        run: |
          pod=$(kubectl -n vinaire get pod -l app.kubernetes.io/name=vinaire -o jsonpath='{.items[0].metadata.name}')
          kubectl -n vinaire get pod "$pod" -o jsonpath='{.spec.containers[0].securityContext}{"\n"}{.spec.securityContext}{"\n"}'
          kubectl -n vinaire get pod "$pod" -o jsonpath='{.spec.containers[0].securityContext.readOnlyRootFilesystem}' | grep -q true
          kubectl -n vinaire get pod "$pod" -o jsonpath='{.spec.containers[0].securityContext.allowPrivilegeEscalation}' | grep -q false
          kubectl -n vinaire get pod "$pod" -o jsonpath='{.spec.securityContext.runAsNonRoot}' | grep -q true
      - name: Vinaire's own ServiceAccount has no wildcard rule and can't read Secrets
        run: |
          sa=system:serviceaccount:vinaire:vinaire
          ! kubectl auth can-i --list --as="$sa" | grep -E '^\*|\[\*\]'
          [ "$(kubectl auth can-i get secrets -A --as="$sa")" = "no" ]
          [ "$(kubectl auth can-i delete deployments -A --as="$sa")" = "no" ]
      - name: Wait until the ingress answers
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8080/healthz && exit 0; sleep 2; done
          kubectl -n vinaire get pods,ingress; kubectl -n kube-system get pods; exit 1

      # The CSP, headers and CSRF guard checked in a real browser: no violations on
      # the main pages, an injected inline script is blocked, a cross-site POST is refused.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser security checks
        working-directory: frontend
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:8080 E2E_SAME_ORIGIN=1 npx playwright test e2e/security.spec.ts

      # Passive baseline. .zap/rules.tsv turns the checks for what Phase 36 hardened (CSP,
      # cookie flags, framing, sniffing) into failures. It scans the same image run on its own
      # with the chart's container hardening (non-root, read-only filesystem, no capabilities)
      # rather than through the cluster's ingress: the ingress path answered ZAP with
      # intermittent 503s that came from the load balancer, never from Vinaire, and the
      # headers ZAP judges are Vinaire's own.
      - name: Start the image for ZAP
        run: |
          docker run -d --name vinaire-zap -p 8081:8080 --read-only --cap-drop ALL \
            --security-opt no-new-privileges vinaire:ci
          ok=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8081/healthz && curl -sf -o /dev/null http://localhost:8081/ \
               && curl -sf -o /dev/null http://localhost:8081/login/; then ok=$((ok+1)); else ok=0; fi
            [ "$ok" -ge 3 ] && exit 0
            sleep 1
          done
          docker logs vinaire-zap --tail=40; exit 1
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8081
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
      - name: The image's log when ZAP failed
        if: failure()
        run: docker logs vinaire-zap --tail=60 || true
