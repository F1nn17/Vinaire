name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go vet (integration build tag)
        # Doesn't run the suite (that needs a real cluster — see the
        # integration job below), just makes sure it still compiles on
        # every push, not only on the PRs that job runs for.
        run: go vet -tags=integration ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm install
        run: npm install

      - name: eslint
        run: npm run lint

      - name: npm run build
        run: npm run build

  # Roadmap Phase 23: real requests against a real, disposable k3d cluster
  # — never mocked client-go, never a mocked backend for the frontend e2e
  # test either. Deliberately PR-only (not on every push to main), per
  # this phase's own risk note: standing up k3d + running a full browser
  # is noticeably slower than the lint/build jobs above.
  integration:
    name: Integration + e2e (real k3d cluster)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Create k3d cluster
        run: k3d cluster create vinaire-ci --agents 0 --wait --timeout 120s

      - name: Apply test fixtures
        run: kubectl apply -f backend/integration/testdata/manifests.yaml

      - name: Wait for test fixtures to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=demo -n vinaire-ci-test --timeout=120s
          kubectl wait --for=condition=ready pod -l app=demo-sts -n vinaire-ci-test --timeout=120s
          kubectl wait --for=condition=complete job/demo-job -n vinaire-ci-test --timeout=120s

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: Build backend
        working-directory: backend
        run: go build -o vinaire .

      - name: Start backend (AUTH_MODE=disabled) for integration tests
        working-directory: backend
        run: |
          AUTH_MODE=disabled PORT=8080 ./vinaire > backend-integration.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz && exit 0; sleep 1; done
          echo "backend never became healthy"; cat backend-integration.log; exit 1

      - name: Run Go integration tests
        working-directory: backend
        env:
          VINAIRE_BASE_URL: http://localhost:8080
        run: go test -tags=integration -count=1 -v ./integration/...

      - name: Stop backend
        working-directory: backend
        run: kill "$(cat backend.pid)" 2>/dev/null || true

      - name: Provision an e2e login token
        run: |
          kubectl create serviceaccount vinaire-e2e -n default
          kubectl create clusterrolebinding vinaire-e2e --clusterrole=cluster-admin --serviceaccount=default:vinaire-e2e
          echo "E2E_TOKEN=$(kubectl create token vinaire-e2e --duration=15m)" >> "$GITHUB_ENV"

      - name: Start backend (AUTH_MODE=token) for e2e
        working-directory: backend
        run: |
          AUTH_MODE=token PORT=8080 ./vinaire > backend-e2e.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz && exit 0; sleep 1; done
          echo "backend never became healthy"; cat backend-e2e.log; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm install
        working-directory: frontend
        run: npm install

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend dev server
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8080
        run: |
          npm run dev > frontend.log 2>&1 &
          echo $! > frontend.pid
          for i in $(seq 1 60); do curl -sf http://localhost:3100 > /dev/null && exit 0; sleep 1; done
          echo "frontend never became reachable"; cat frontend.log; exit 1

      - name: Run e2e tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3100
          E2E_TOKEN: ${{ env.E2E_TOKEN }}
        run: npx playwright test

      - name: Dump cluster/pod state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe pods -n vinaire-ci-test
          cat backend/backend-integration.log 2>/dev/null || true
          cat backend/backend-e2e.log 2>/dev/null || true
          cat frontend/frontend.log 2>/dev/null || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Delete k3d cluster
        if: always()
        run: k3d cluster delete vinaire-ci
