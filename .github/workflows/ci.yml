name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go vet (integration build tag)
        # Doesn't run the suite (that needs a real cluster — see the
        # integration job below), just makes sure it still compiles on
        # every push, not only on the PRs that job runs for.
        run: go vet -tags=integration ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm install
        run: npm install

      - name: eslint
        run: npm run lint

      - name: theme contrast and colour tokens
        run: npm run check:theme

      - name: interface-language dictionaries
        run: npm run check:i18n

      - name: npm run build
        run: npm run build

  # Roadmap Phase 23: real requests against a real, disposable k3d cluster
  # — never mocked client-go, never a mocked backend for the frontend e2e
  # test either. Deliberately PR-only (not on every push to main), per
  # this phase's own risk note: standing up k3d + running a full browser
  # is noticeably slower than the lint/build jobs above.
  integration:
    name: Integration + e2e (real k3d cluster)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install k3d
        run: .github/scripts/install-tools.sh k3d

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Create k3d cluster
        run: k3d cluster create vinaire-ci --agents 0 --wait --timeout 120s

      - name: Wait until the cluster's API answers steadily
        run: .github/scripts/wait-for-cluster.sh

      - name: Apply test fixtures
        run: kubectl apply -f backend/integration/testdata/manifests.yaml

      - name: Wait for test fixtures to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=demo -n vinaire-ci-test --timeout=120s
          kubectl wait --for=condition=ready pod -l app=demo-sts -n vinaire-ci-test --timeout=120s
          kubectl wait --for=condition=complete job/demo-job -n vinaire-ci-test --timeout=120s

      # Roadmap Phase 78: the lifecycle scenarios (install -> recreate the pod -> dump -> restore ->
      # delete, for PostgreSQL and Redis) install exactly what the "Install from an image" wizard
      # builds, so its code renders the manifests (frontend/scripts/render-image-fixtures.ts).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Render the wizard's manifests for the lifecycle scenarios
        working-directory: frontend
        run: |
          npm ci
          fx="$RUNNER_TEMP/lifecycle-fixtures"
          npx --yes tsx@4.20.3 scripts/render-image-fixtures.ts "$fx" lifecycle-ci postgres:pgsrc postgres:pgdst
          npx --yes tsx@4.20.3 scripts/render-image-fixtures.ts "$fx" lifecycle-ci-redis redis:rd
          echo "LIFECYCLE_FIXTURES=$fx" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum

      - name: Build backend
        working-directory: backend
        run: go build -o vinaire .

      - name: Start backend (AUTH_MODE=disabled) for integration tests
        working-directory: backend
        run: |
          AUTH_MODE=disabled PORT=8080 ./vinaire > backend-integration.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz && exit 0; sleep 1; done
          echo "backend never became healthy"; cat backend-integration.log; exit 1

      - name: Run Go integration tests
        working-directory: backend
        env:
          VINAIRE_BASE_URL: http://localhost:8080
          LIFECYCLE_FIXTURES: ${{ env.LIFECYCLE_FIXTURES }}
        run: go test -tags=integration -count=1 -v -timeout 20m ./integration/...

      - name: Stop backend
        working-directory: backend
        run: kill "$(cat backend.pid)" 2>/dev/null || true

      - name: Provision an e2e login token
        run: |
          kubectl create serviceaccount vinaire-e2e -n default
          kubectl create clusterrolebinding vinaire-e2e --clusterrole=cluster-admin --serviceaccount=default:vinaire-e2e
          echo "E2E_TOKEN=$(kubectl create token vinaire-e2e --duration=15m)" >> "$GITHUB_ENV"

      - name: Start backend (AUTH_MODE=token) for e2e
        working-directory: backend
        run: |
          AUTH_MODE=token PORT=8080 ./vinaire > backend-e2e.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz && exit 0; sleep 1; done
          echo "backend never became healthy"; cat backend-e2e.log; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm install
        working-directory: frontend
        run: npm install

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend dev server
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8080
        run: |
          npm run dev > frontend.log 2>&1 &
          echo $! > frontend.pid
          for i in $(seq 1 60); do curl -sf http://localhost:3100 > /dev/null && exit 0; sleep 1; done
          echo "frontend never became reachable"; cat frontend.log; exit 1

      - name: Run e2e tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3100
          E2E_TOKEN: ${{ env.E2E_TOKEN }}
        run: npx playwright test

      - name: Dump cluster/pod state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe pods -n vinaire-ci-test
          cat backend/backend-integration.log 2>/dev/null || true
          cat backend/backend-e2e.log 2>/dev/null || true
          cat frontend/frontend.log 2>/dev/null || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Delete k3d cluster
        if: always()
        run: k3d cluster delete vinaire-ci

  # Roadmap Phase 83: the whole Keycloak sign-in in a real browser — set up from Settings, a person signs in
  # (changing a temporary password on the way), lands back on THIS Vinaire, is a ServiceAccount of their own
  # with no rights until a role is bound, and signing in again finds the same account. Vinaire runs INSIDE the
  # cluster (the identity broker needs the pod's own identity), built from this checkout; Keycloak runs as a
  # container on the runner at the docker network's gateway address — a private address both the browser and
  # the pod can reach, so plain http is exactly the home-server case the feature exists for. PR-only, like the
  # integration job: building the image and starting Keycloak take minutes.
  keycloak-e2e:
    name: Keycloak sign-in (real browser, real cluster)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KC_ADMIN_PASSWORD: ci-keycloak-admin-pw
    steps:
      - uses: actions/checkout@v4

      - name: Install k3d
        run: .github/scripts/install-tools.sh k3d

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Build the image from this checkout
        run: docker build -t vinaire:ci .

      - name: Create the cluster and load the image
        run: |
          k3d cluster create vinaire-e2e --agents 0 --wait --timeout 180s
          k3d image import vinaire:ci -c vinaire-e2e

      - name: Wait until the cluster's API answers steadily
        run: .github/scripts/wait-for-cluster.sh

      - name: Start Keycloak on the cluster network's gateway address
        run: |
          gw=$(docker network inspect k3d-vinaire-e2e -f '{{(index .IPAM.Config 0).Gateway}}')
          echo "gateway: $gw"
          docker run -d --name keycloak -p 8180:8080 \
            -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD="$KC_ADMIN_PASSWORD" \
            quay.io/keycloak/keycloak:26.0 start-dev
          for i in $(seq 1 90); do
            curl -sf "http://$gw:8180/realms/master" > /dev/null && break
            sleep 3
          done
          curl -sf "http://$gw:8180/realms/master" > /dev/null || { docker logs keycloak | tail -40; exit 1; }
          echo "E2E_KEYCLOAK_URL=http://$gw:8180" >> "$GITHUB_ENV"

      - name: Install Vinaire from the chart (token mode, http Keycloak on a private network)
        run: |
          helm install vinaire charts/vinaire --namespace vinaire --create-namespace \
            --set image.repository=vinaire --set image.tag=ci --set image.pullPolicy=Never \
            --set authMode=token --set cookie.secure=false \
            --set keycloak.allowHttpPrivateNetwork=true \
            --wait --timeout 180s

      - name: Reach Vinaire and provision the administrator's token
        run: |
          kubectl -n vinaire port-forward svc/vinaire 18080:8080 > port-forward.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:18080/healthz > /dev/null && break; sleep 1; done
          kubectl create serviceaccount e2e-admin -n default
          kubectl create clusterrolebinding e2e-admin --clusterrole=cluster-admin --serviceaccount=default:e2e-admin
          echo "E2E_ADMIN_TOKEN=$(kubectl create token e2e-admin -n default --duration=40m)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci and Playwright's browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the Keycloak sign-in test
        working-directory: frontend
        env:
          E2E_VINAIRE_URL: http://localhost:18080
          E2E_KC_ADMIN_USER: admin
          E2E_KC_ADMIN_PASSWORD: ${{ env.KC_ADMIN_PASSWORD }}
        run: npx playwright test keycloak.spec.ts

      - name: Dump what happened on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n vinaire logs deploy/vinaire --tail=200 || true
          kubectl get serviceaccount -A -l app.kubernetes.io/managed-by=vinaire || true
          docker logs keycloak --tail=80 || true
          cat port-forward.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Delete the cluster and Keycloak
        if: always()
        run: |
          docker rm -f keycloak || true
          k3d cluster delete vinaire-e2e || true

  chart:
    name: Helm chart (lint + render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: helm lint (defaults and both example value files)
        run: |
          helm lint charts/vinaire
          helm lint charts/vinaire -f charts/vinaire/examples/values-local.yaml
          helm lint charts/vinaire -f charts/vinaire/examples/values-production.yaml

      - name: helm template (the install variants the README documents)
        run: |
          t() { helm template vinaire charts/vinaire -n vinaire "$@" > /dev/null; }
          t
          t --set authMode=disabled
          t --set ingress.enabled=true --set ingress.className=traefik --set 'ingress.hosts[0].host=vinaire.k3s.home'
          t --set ingress.enabled=true --set cookie.secure=false
          t -f charts/vinaire/examples/values-local.yaml
          t -f charts/vinaire/examples/values-production.yaml
          t --set authMode=oidc --set oidc.issuerURL=https://kc/realms/x --set oidc.clientID=vinaire             --set oidc.redirectURL=https://vinaire/api/v1/auth/oidc/callback --set oidc.existingSecret=vinaire-oidc

      - name: values.schema.json rejects what it should
        run: |
          bad() {
            if helm template vinaire charts/vinaire -n vinaire "$@" > /dev/null 2>&1; then
              echo "::error::accepted values that must be rejected: $*"; exit 1
            fi
          }
          bad --set authMode=tokens
          bad --set image.pullPolicy=Sometimes
          bad --set service.port=70000
          bad --set cookie.sameSite=maybe
          bad --set authMode=oidc
          bad --set ingress.enabled=true --set 'ingress.hosts=null'

  # Roadmap Phase 92: an upgrade of a REAL earlier release must work, not only a fresh install. `helm upgrade
  # --reuse-values` replaces the new chart's defaults with the old release's values, so a key added since
  # (`rbac.reader.create` in 1.3.0) is absent and a template that reads it fails — which the fresh-install tests above
  # can't see. This installs the oldest and the most recent earlier release from their tags (no image is pulled: only
  # the objects are created) and upgrades each to this checkout with --reuse-values. PR-only: it starts a cluster.
  chart-upgrade:
    name: Helm upgrade from earlier releases (--reuse-values)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install k3d
        run: .github/scripts/install-tools.sh k3d

      - name: Create a cluster
        run: k3d cluster create vinaire-upgrade --agents 0 --no-lb --wait --timeout 180s

      - name: Wait until the cluster's API answers steadily
        run: .github/scripts/wait-for-cluster.sh

      - name: Upgrade each earlier release to this checkout
        run: |
          set -e
          cur=$(grep '^version:' charts/vinaire/Chart.yaml | head -1 | tr -d ' "\r' | cut -d: -f2)
          # the oldest tag, and the newest one that is not this very version (a release already tagged is skipped)
          tags=$(git tag -l 'v[0-9]*' --sort=v:refname | grep -v -x "v$cur" | grep -v -- '-')
          from=$( (echo "$tags" | head -1; echo "$tags" | tail -1) | sort -u -V )
          echo "upgrading from: $from"
          for tag in $from; do
            rel="up-${tag//./-}"
            dir=$(mktemp -d)
            git archive "$tag" charts/vinaire | tar -x -C "$dir"
            helm install "$rel" "$dir/charts/vinaire" -n "$rel" --create-namespace
            helm upgrade "$rel" charts/vinaire -n "$rel" --reuse-values
            test "$(helm status "$rel" -n "$rel" -o json | jq -r .info.status)" = "deployed"
            # a role added after that release must exist now (the defaults were filled in), and a value the person set stays
            kubectl get clusterrole "$rel-vinaire-reader" > /dev/null
            helm upgrade "$rel" charts/vinaire -n "$rel" --reuse-values --set rbac.reader.create=false
            if kubectl get clusterrole "$rel-vinaire-reader" > /dev/null 2>&1; then
              echo "::error::rbac.reader.create=false was ignored on an upgrade from $tag"; exit 1
            fi
          done

      - name: Delete the cluster
        if: always()
        run: k3d cluster delete vinaire-upgrade
